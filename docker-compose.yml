version: '3.8'

services:
  # 1. Core API (Laravel 11 + PHP 8.3)
  app-core:
    image: php:8.3-fpm-alpine
    container_name: nexus_core
    volumes:
      - ./core:/var/www/html
    env_file:
      - ./core/.env
    networks:
      - nexus_network
    environment:
      - REDIS_HOST=cache-redis
    depends_on:
      - db-postgres
      - cache-redis

  # 2. Motor de IA (FastAPI + LangChain + Gemini)
  app-ai:
    image: python:3.11-slim
    container_name: nexus_ai
    volumes:
      - ./ai:/app
    working_dir: /app
    env_file:
      - ./ai/.env
      - ./core/.env
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8080 --reload"
    ports:
      - "8080:8080"
    networks:
      - nexus_network
    environment:
      # Dentro de Compose, Chroma se alcanza por el nombre del servicio.
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - chroma
      - db-mongo

  # 3. Base de Datos Vectorial RAG (ChromaDB)
  chroma:
    image: chromadb/chroma:latest
    container_name: nexus_chromadb
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    networks:
      - nexus_network
  # 5. Frontend (React 18 + TypeScript) - Usando Node para desarrollo
  app-web:
    image: node:20-alpine
    container_name: nexus_web
    volumes:
      - ./web:/app
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    networks:
      - nexus_network

  # 6a. Base de Datos Transaccional (PostgreSQL)
  db-postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - nexus_network

  # 6b. Base de Datos de Historial (MongoDB)
  db-mongo:
    image: mongo:7-jammy
    container_name: nexus_mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - nexus_network

  # 6c. Caché y Colas (Redis)
  cache-redis:
    image: redis:7-alpine
    container_name: nexus_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nexus_network

  # 7. Proxy Gateway (Nginx)
  proxy-nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - nexus_network
    depends_on:
      - app-core
      - app-ai
      - app-web
      - chroma
  # 8. Ollama (Opcional, 100% offline) - Descomentar si se va a usar
  # ollama:
  #   image: ollama/ollama
  #   container_name: nexus_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   networks:
  #     - nexus_network

networks:
  nexus_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  chroma_data:
  ollama_models:
